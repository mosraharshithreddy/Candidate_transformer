<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Candidate Profile Transformer</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h2 class="mb-0">
                        Candidate Profile Transformer
                    </h2>

                </div>

                <div class="card-body">

                    <p class="text-muted">

                        Upload candidate information and generate a unified canonical profile.

                    </p>

                    <form
                        action="/process"
                        method="POST"
                        enctype="multipart/form-data">

                        <div class="mb-4">

                            <label class="form-label">

                                Resume (PDF)

                            </label>

                            <input
                                type="file"
                                class="form-control"
                                name="resume"
                                accept=".pdf"
                                required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">

                                Recruiter CSV

                            </label>

                            <input
                                type="file"
                                class="form-control"
                                name="recruiter"
                                accept=".csv"
                                required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">

                                GitHub Username (Optional)

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="github"
                                placeholder="Enter GitHub username">

                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary w-100">

                            Generate Candidate Profile

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
